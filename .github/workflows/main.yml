name: Tabdeal BTC Futures Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tabdeal-btc-bot
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTC Futures Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python btc_futures_bot.py

      - name: Save bot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f btc_futures_snapshots.json ]; then
            git add btc_futures_snapshots.json
          fi

          if [ -f btc_futures_signals.json ]; then
            git add btc_futures_signals.json
          fi

          if git diff --cached --quiet; then
            echo "No bot data to save."
          else
            git commit -m "Update BTC Futures bot data"
            git push
          fi
